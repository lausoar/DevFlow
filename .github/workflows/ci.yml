name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 同一分支的新推送取消上一次未完成的运行
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: 后端（编译 + 单测）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: 编译
        working-directory: backend
        run: mvn -B -q compile -DskipTests

      # 只跑不依赖外部服务的单测：PermissionMatrixHttpTest 需要真实后端 + 数据库，排除
      - name: 单元测试
        working-directory: backend
        run: >
          mvn -B test
          -Dtest='EnterpriseRolesTest,PermissionServiceImplTest,GuestServiceImplTest,ProjectAccessServiceImplTest,SearchServiceImplTest,AutomationRuleServiceImplTest,QueryExpressionParserTest'
          -DfailIfNoSpecifiedTests=false

      - name: 上传测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-surefire
          path: backend/target/surefire-reports/
          retention-days: 7

  frontend:
    name: 前端（类型检查 + Lint + 构建）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 安装依赖
        working-directory: frontend
        run: npm ci

      - name: 类型检查
        working-directory: frontend
        run: npx tsc --noEmit

      # Lint 目前仍有存量告警，先不阻断合并（后续批次清干净后改为 --max-warnings=0）
      - name: Lint
        working-directory: frontend
        run: npm run lint || true

      - name: 构建
        working-directory: frontend
        run: npm run build

  ai-service:
    name: AI 服务（语法 + Ruff）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装
        working-directory: ai-service
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Ruff 检查
        working-directory: ai-service
        run: ruff check app

      - name: 导入检查（能 import 说明依赖装配没有语法级错误）
        working-directory: ai-service
        env:
          JWT_SECRET: dGVzdC1qd3Qtc2VjcmV0LWtleS0zMi1ieXRlcy1sb25nLXJhbmRvbQ==
        run: |
          pip install fastapi pydantic pydantic-settings httpx python-jose[cryptography] openai
          python -c "import sys; sys.path.insert(0,'.'); import app.main"

  docker:
    name: 镜像构建（不推送）
    runs-on: ubuntu-latest
    needs: [backend]
    strategy:
      matrix:
        include:
          - context: backend
            name: backend
          - context: frontend
            name: frontend
          - context: ai-service
            name: ai
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # 只验证 Dockerfile 可构建；推送镜像需要仓库密钥，属于部署流水线的职责
      - name: Build ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: false
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

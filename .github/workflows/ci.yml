name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 同一分支的新推送取消上一次未完成的运行
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: 后端（编译 + 单测）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: 编译
        working-directory: backend
        run: mvn -B -q compile -DskipTests

      # 只跑不依赖外部服务的单测：PermissionMatrixHttpTest 需要真实后端 + 数据库，排除
      - name: 单元测试
        working-directory: backend
        run: >
          mvn -B test
          -Dtest='*,!PermissionMatrixHttpTest'
          -DfailIfNoSpecifiedTests=false

      - name: 上传测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-surefire
          path: backend/target/surefire-reports/
          retention-days: 7

  # 集成验证：起真实 MySQL + Redis，由应用执行 Flyway 迁移并验证关键接口。
  # 覆盖单测覆盖不到的一类缺陷（2026-11-15 验证中发现的 5 个缺陷全在此列）：
  # 表未创建、schema 非幂等、审计链精度/排序/分叉、Servlet 流冲突、库串用。
  integration:
    name: 集成验证（真实 MySQL）
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: devflow123
          MYSQL_DATABASE: devflow_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: 安装 mysql 客户端
        run: sudo apt-get update && sudo apt-get install -y default-mysql-client python3

      - name: 集成验证
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: '3306'
          DB_USERNAME: root
          DB_PASSWORD: devflow123
          DB_NAME: devflow_ci
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: '6379'
          REDIS_PASSWORD: ''
        run: bash scripts/verify-integration.sh

  frontend:
    name: 前端（测试 + 类型检查 + Lint + 构建）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 安装依赖
        working-directory: frontend
        run: npm ci

      - name: 生产依赖漏洞门禁
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high

      - name: 单元测试
        working-directory: frontend
        run: npm test

      - name: 类型检查
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Lint
        working-directory: frontend
        # 不再 || true：lint 失败就是真失败。warning 级仍不阻断，
        # 但 error 级（如 set-state-in-effect）会让 CI 变红。
        run: npm run lint -- --max-warnings=-1

      - name: 构建
        working-directory: frontend
        run: npm run build

  ai-service:
    name: AI 服务（语法 + Ruff）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装
        working-directory: ai-service
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Ruff 检查
        working-directory: ai-service
        run: ruff check app

      - name: 导入检查（能 import 说明依赖装配没有语法级错误）
        working-directory: ai-service
        env:
          JWT_SECRET: dGVzdC1qd3Qtc2VjcmV0LWtleS0zMi1ieXRlcy1sb25nLXJhbmRvbQ==
        run: |
          pip install fastapi pydantic pydantic-settings httpx python-jose[cryptography] openai
          python -c "import sys; sys.path.insert(0,'.'); import app.main"

      # 这些用例只覆盖纯逻辑（JWT 验签算法族、离线降级、占位 Key 判定），
      # 不依赖真实 LLM / 数据库 / 网络，因此可以放在 CI 里跑。
      - name: 单元测试
        working-directory: ai-service
        env:
          JWT_SECRET: dGVzdC1qd3Qtc2VjcmV0LWtleS0zMi1ieXRlcy1sb25nLXJhbmRvbQ==
        run: |
          pip install pytest pytest-asyncio
          python -m pytest -q

  docker:
    name: 镜像构建（不推送）
    runs-on: ubuntu-latest
    needs: [backend, integration]
    strategy:
      matrix:
        include:
          - context: backend
            name: backend
          - context: frontend
            name: frontend
          - context: ai-service
            name: ai
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # 只验证 Dockerfile 可构建；推送镜像需要仓库密钥，属于部署流水线的职责
      - name: Build ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: false
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  production-smoke:
    name: 生产 Compose 冒烟（含 SockJS/STOMP）
    runs-on: ubuntu-latest
    needs: [backend, integration, frontend, ai-service, docker]
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装 SockJS 客户端
        run: python -m pip install websocket-client

      - name: 构建并验证真实生产编排
        run: python scripts/production-smoke.py

      - name: 上传生产冒烟日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-smoke-logs
          path: artifacts/production-smoke/
          if-no-files-found: ignore
          retention-days: 7

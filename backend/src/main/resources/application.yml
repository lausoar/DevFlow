# DevFlow 后端服务配置
#
# 安全约定（见 docs/AUDIT_REPORT_2026-11.md §A5）：
# - 所有敏感值都从环境变量注入，仓库里的默认值只够本机开发用；
# - jwt.secret 没有默认值：未设置时启动会生成一次性随机密钥（重启即让旧 Token 失效），
#   生产环境必须显式设置 JWT_SECRET（Base64 编码，>= 32 字节）。
server:
  port: 8080
  servlet:
    context-path: /api/v1
  # 优雅停机：等待在途请求与 WebSocket 会话收尾
  shutdown: graceful

spring:
  application:
    name: devflow-backend

  lifecycle:
    timeout-per-shutdown-phase: 20s

  # 数据源配置
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/devflow?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:devflow123}
    driver-class-name: com.mysql.cj.jdbc.Driver

  # Redis 配置（docker-compose 映射到宿主机 6380）
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6380}
      password: ${REDIS_PASSWORD:}
      database: 0

  # Jackson 配置
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null

  # SQL 初始化（自动执行 schema.sql；必须显式指定编码，否则 Windows 默认 GBK 读取导致中文乱码）
  sql:
    init:
      mode: always
      continue-on-error: true
      encoding: utf-8

  # 文件上传限制
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 100MB

# MyBatis Plus 配置
mybatis-plus:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: com.devflow.entity
  global-config:
    db-config:
      id-type: assign_uuid
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    map-underscore-to-camel-case: true
    # 生产环境请设为 org.apache.ibatis.logging.nologging.NoLoggingImpl，避免 SQL 全量打到 stdout
    log-impl: ${MYBATIS_LOG_IMPL:org.apache.ibatis.logging.stdout.StdOutImpl}

# JWT 配置
# secret 为 Base64 编码的 HMAC 密钥；留空时启动生成一次性随机密钥（仅适合本机开发）
jwt:
  secret: ${JWT_SECRET:}
  expiration: ${JWT_EXPIRATION:86400000}  # 24 小时
  refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800000}  # 7 天

# MinIO 配置（docker-compose 映射到宿主机 9002，控制台 9003）
minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9002}
  access-key: ${MINIO_ACCESS_KEY:minioadmin}
  secret-key: ${MINIO_SECRET_KEY:minioadmin}
  bucket: ${MINIO_BUCKET:devflow}

# OpenAPI 配置（生产环境建议关闭 swagger-ui：SWAGGER_ENABLED=false）
springdoc:
  api-docs:
    path: /api-docs
    enabled: ${SWAGGER_ENABLED:true}
  swagger-ui:
    path: /swagger-ui.html
    enabled: ${SWAGGER_ENABLED:true}

# AI 服务配置（文档知识库同步、聊天 @AI 助手）
ai:
  service:
    base-url: ${AI_SERVICE_URL:http://localhost:8000/api/v1}
    # 与 ai-service 的 AI_SERVICE_TOKEN 保持一致；AI 服务强制认证后服务间调用必须携带
    token: ${AI_SERVICE_TOKEN:}

# WebSocket 跨域白名单（与 HTTP CORS 一致，不再通配）
websocket:
  allowed-origin-patterns: ${WS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001}

# HTTP CORS 白名单
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001}

# 可观测性：健康探针与指标
# 管理端点独立端口（9090），不与业务端口共用：
# 生产环境只把 9090 暴露给内网/监控系统，业务端口不对外提供 /actuator
management:
  server:
    port: ${MANAGEMENT_PORT:9090}
  endpoints:
    web:
      exposure:
        # health/info 公开；prometheus 供抓取；其余默认不暴露
        include: ${MANAGEMENT_ENDPOINTS:health,info,prometheus}
  endpoint:
    health:
      probes:
        enabled: true          # K8s liveness/readiness
      show-details: ${HEALTH_SHOW_DETAILS:never}
  metrics:
    tags:
      application: devflow-backend
  prometheus:
    metrics:
      export:
        enabled: true

# 日志配置
logging:
  level:
    com.devflow: ${LOG_LEVEL:debug}
    org.springframework.security: info

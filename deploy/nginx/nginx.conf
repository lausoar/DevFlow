# ============================================
# DevFlow Nginx 反向代理（生产入口）
# ============================================
# 路由：
#   /            → frontend:3000   (Next.js)
#   /api/        → backend:8080    (Spring Boot，context-path 为 /api/v1)
#   /ai-api/     → ai:8000         (FastAPI，剥掉 /ai-api 前缀)
#   /api/v1/ws   → backend:8080    (STOMP/SockJS 长连接，需 upgrade 头)
#
# TLS：把证书放到 deploy/nginx/certs/（fullchain.pem + privkey.pem）；
# 未提供证书时注释掉 443 段，仅用 80（内网/网关后面终结 TLS 时也是这种部署）。

worker_processes auto;
events {
    worker_connections 4096;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    tcp_nopush    on;
    keepalive_timeout 65;
    client_max_body_size 100m;   # 与后端 multipart 上限对齐

    # 结构化访问日志（便于接 ELK/Loki）
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" rt=$request_time';
    access_log /var/log/nginx/access.log main;

    # WebSocket 升级所需的连接头映射
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # 后端安全响应头（应用侧也发了，这里再兜一层，防止绕过应用直连 nginx 的路径缺失）
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    upstream backend  { server backend:8080;  keepalive 32; }
    upstream frontend { server frontend:3000; keepalive 32; }
    upstream ai       { server ai:8000;       keepalive 16; }

    server {
        listen 80;
        server_name _;

        # 证书存在时把 80 全部重定向到 443
        # location / { return 301 https://$host$request_uri; }

        location /api/ {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # SSE / 长请求
            proxy_buffering off;
            proxy_read_timeout 120s;
        }

        location /ai-api/ {
            # 浏览器使用 /ai-api/api/v1；/ai-api/health 对应 AI 的 /health。
            rewrite ^/ai-api/(.*)$ /$1 break;
            proxy_pass http://ai;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # LLM 生成常见 30-60s
            proxy_read_timeout 180s;
        }

        # SockJS 的 /info、XHR 与 /websocket 传输都在此路径下，必须直达 Spring。
        location /api/v1/ws {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade           $http_upgrade;
            proxy_set_header Connection        $connection_upgrade;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        location / {
            proxy_pass http://frontend;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # server {
    #     listen 443 ssl;
    #     http2 on;
    #     server_name devflow.example.com;
    #
    #     ssl_certificate     /etc/nginx/certs/fullchain.pem;
    #     ssl_certificate_key /etc/nginx/certs/privkey.pem;
    #     ssl_protocols       TLSv1.2 TLSv1.3;
    #     ssl_ciphers         HIGH:!aNULL:!MD5;
    #     add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    #
    #     # 与上面 80 段完全相同的 location 配置
    # }
}

# ============================================
# DevFlow 生产部署编排（三端应用 + 基础设施）
# ============================================
# 与根目录 docker-compose.yml（仅基础设施、开发用）区分：
#   docker compose -f docker-compose.prod.yml up -d --build
#
# 前置：根目录 .env 至少配置 JWT_SECRET 与 AI_SERVICE_TOKEN（两边一致），
#       详见 docs/SECURITY_HARDENING.md。
# 入口：Nginx 反代 80/443 → frontend:3000 / backend:8080 / ai:8000

name: devflow-prod

services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD 必须设置}
      MYSQL_DATABASE: devflow
      MYSQL_CHARSET: utf8mb4
      MYSQL_COLLATION: utf8mb4_unicode_ci
      TZ: Asia/Shanghai
    volumes:
      - mysql_data:/var/lib/mysql
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [devflow]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [devflow]

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY 必须设置}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY 必须设置}
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [devflow]

  chromadb:
    image: chromadb/chroma:latest
    restart: unless-stopped
    volumes:
      - chroma_data:/chroma/chroma
    environment:
      IS_PERSISTENT: "TRUE"
    networks: [devflow]

  backend:
    build:
      context: ./backend
    image: devflow/backend:${TAG:-latest}
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      DB_URL: jdbc:mysql://mysql:3306/devflow?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
      DB_USERNAME: root
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET: ${MINIO_BUCKET:-devflow}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET 必须设置}
      AI_SERVICE_URL: http://ai:8000/api/v1
      AI_SERVICE_TOKEN: ${AI_SERVICE_TOKEN:?AI_SERVICE_TOKEN 必须设置}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost}
      WS_ALLOWED_ORIGINS: ${WS_ALLOWED_ORIGINS:-http://localhost}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      MYBATIS_LOG_IMPL: ${MYBATIS_LOG_IMPL:-org.apache.ibatis.logging.nologging.NoLoggingImpl}
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-false}
      JAVA_OPTS: ${JAVA_OPTS:--XX:MaxRAMPercentage=75 -XX:+UseG1GC}
    volumes:
      - backend_logs:/app/logs
    networks: [devflow]

  ai:
    build:
      context: ./ai-service
    image: devflow/ai:${TAG:-latest}
    restart: unless-stopped
    depends_on:
      chromadb:
        condition: service_started
    environment:
      JWT_SECRET: ${JWT_SECRET}
      AI_SERVICE_TOKEN: ${AI_SERVICE_TOKEN}
      BACKEND_API_URL: http://backend:8080/api/v1
      CHROMA_HOST: chromadb
      CHROMA_PORT: "8000"
      AI_PROVIDER: ${AI_PROVIDER:-openai}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DASHSCOPE_API_KEY: ${QWEN_API_KEY:-}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-api}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-}
      EMBEDDING_LOCAL_MODEL: ${EMBEDDING_LOCAL_MODEL:-BAAI/bge-small-zh-v1.5}
      CORS_ALLOW_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost}
      HF_HOME: /data/hf
    volumes:
      # 本地嵌入模型缓存：不挂卷的话每次重建都要重新下载
      - ai_models:/data
    networks: [devflow]

  frontend:
    build:
      context: ./frontend
      args:
        # 浏览器访问的后端地址（对外域名，不是容器名）
        NEXT_PUBLIC_API_BASE_URL: ${PUBLIC_API_BASE_URL:-http://localhost/api/v1}
        NEXT_PUBLIC_AI_BASE_URL: ${PUBLIC_AI_BASE_URL:-http://localhost/ai-api/v1}
    image: devflow/frontend:${TAG:-latest}
    restart: unless-stopped
    depends_on:
      - backend
    networks: [devflow]

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - frontend
      - backend
      - ai
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/nginx/certs:/etc/nginx/certs:ro
    networks: [devflow]

volumes:
  mysql_data:
  redis_data:
  minio_data:
  chroma_data:
  ai_models:
  backend_logs:

networks:
  devflow:
    driver: bridge

# ============================================
# DevFlow 生产部署编排（三端应用 + 基础设施）
# ============================================
# 与根目录 docker-compose.yml（仅基础设施、开发用）区分：
#   docker compose -f docker-compose.prod.yml up -d --build
#
# 前置：根目录 .env 至少配置 JWT_SECRET 与 AI_SERVICE_TOKEN（两边一致），
#       详见 docs/SECURITY_HARDENING.md。
# 入口：Nginx 反代 80/443 → frontend:3000 / backend:8080 / ai:8000

name: devflow-prod

services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD 必须设置}
      MYSQL_DATABASE: devflow
      MYSQL_CHARSET: utf8mb4
      MYSQL_COLLATION: utf8mb4_unicode_ci
      TZ: Asia/Shanghai
    volumes:
      - mysql_data:/var/lib/mysql
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --default-authentication-plugin=mysql_native_password
      --slow-query-log=1
      --slow-query-log-file=/var/lib/mysql/slow.log
      --long-query-time=1
      --min-examined-row-limit=1000
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [devflow]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    # 冒烟/开发环境密码为空时不能传 --requirepass（会把它当成缺少参数而退出）；
    # 生产设置密码时才追加认证参数。
    command: >
      /bin/sh -c 'if [ -n "$$REDIS_PASSWORD" ]; then
        exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD";
      else
        exec redis-server --appendonly yes;
      fi'
    volumes:
      - redis_data:/data
    healthcheck:
      # 有密码用认证 PING，无密码直接 PING；不能让健康检查只支持其中一种模式
      test: ["CMD-SHELL", "if [ -n \"$$REDIS_PASSWORD\" ]; then redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping; else redis-cli ping; fi"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [devflow]

  minio:
    # minio/minio 已停止公开分发；Chainguard 镜像兼容相同的启动命令和健康检查。
    # 企业私有仓库可用 MINIO_IMAGE 指向自己的镜像。
    image: ${MINIO_IMAGE:-cgr.dev/chainguard/minio:latest}
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY 必须设置}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY 必须设置}
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      # Chainguard 精简镜像没有 curl，但自带 /usr/bin/mc；用内置客户端探测就绪状态
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [devflow]

  chromadb:
    image: chromadb/chroma:latest
    restart: unless-stopped
    volumes:
      - chroma_data:/chroma/chroma
    environment:
      IS_PERSISTENT: "TRUE"
    networks: [devflow]

  backend:
    build:
      context: ./backend
    image: devflow/backend:${TAG:-latest}
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      DB_URL: jdbc:mysql://mysql:3306/devflow?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
      DB_USERNAME: root
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET: ${MINIO_BUCKET:-devflow}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET 必须设置}
      AI_SERVICE_URL: http://ai:8000/api/v1
      AI_SERVICE_TOKEN: ${AI_SERVICE_TOKEN:?AI_SERVICE_TOKEN 必须设置}
      DEVFLOW_SEED_DEMO_ACCOUNTS: ${DEVFLOW_SEED_DEMO_ACCOUNTS:-false}
      MANAGEMENT_PORT: ${MANAGEMENT_PORT:-9090}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost}
      WS_ALLOWED_ORIGINS: ${WS_ALLOWED_ORIGINS:-http://localhost}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      MYBATIS_LOG_IMPL: ${MYBATIS_LOG_IMPL:-org.apache.ibatis.logging.nologging.NoLoggingImpl}
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-false}
      JAVA_OPTS: ${JAVA_OPTS:--XX:MaxRAMPercentage=75 -XX:+UseG1GC}
    volumes:
      - backend_logs:/app/logs
    # 与 server.shutdown=graceful（20s 等待期）对齐，docker stop 不能比应用先杀进程
    stop_grace_period: 30s
    networks: [devflow]

  ai:
    build:
      context: ./ai-service
    image: devflow/ai:${TAG:-latest}
    restart: unless-stopped
    depends_on:
      chromadb:
        condition: service_started
    environment:
      JWT_SECRET: ${JWT_SECRET}
      AI_SERVICE_TOKEN: ${AI_SERVICE_TOKEN}
      BACKEND_API_URL: http://backend:8080/api/v1
      CHROMA_HOST: chromadb
      CHROMA_PORT: "8000"
      AI_PROVIDER: ${AI_PROVIDER:-openai}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com/v1}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-chat}
      QWEN_API_KEY: ${QWEN_API_KEY:-}
      QWEN_BASE_URL: ${QWEN_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      QWEN_MODEL: ${QWEN_MODEL:-qwen-plus}
      KIMI_API_KEY: ${KIMI_API_KEY:-}
      KIMI_BASE_URL: ${KIMI_BASE_URL:-https://api.moonshot.cn/v1}
      KIMI_MODEL: ${KIMI_MODEL:-moonshot-v1-8k}
      VOLCANO_API_KEY: ${VOLCANO_API_KEY:-}
      VOLCANO_BASE_URL: ${VOLCANO_BASE_URL:-https://ark.cn-beijing.volces.com/api/v3}
      VOLCANO_MODEL: ${VOLCANO_MODEL:-deepseek-v3-250324}
      GLM_API_KEY: ${GLM_API_KEY:-}
      GLM_BASE_URL: ${GLM_BASE_URL:-https://open.bigmodel.cn/api/paas/v4}
      GLM_MODEL: ${GLM_MODEL:-glm-4-flash}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-api}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-https://api.openai.com/v1}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}
      EMBEDDING_LOCAL_MODEL: ${EMBEDDING_LOCAL_MODEL:-BAAI/bge-small-zh-v1.5}
      CORS_ALLOW_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost}
      HF_HOME: /data/hf
    volumes:
      # 本地嵌入模型缓存：不挂卷的话每次重建都要重新下载
      - ai_models:/data
    networks: [devflow]

  frontend:
    build:
      context: ./frontend
      args:
        # 浏览器访问的后端地址（对外域名，不是容器名）
        NEXT_PUBLIC_API_BASE_URL: ${PUBLIC_API_BASE_URL:-/api/v1}
        NEXT_PUBLIC_AI_BASE_URL: ${PUBLIC_AI_BASE_URL:-/ai-api/api/v1}
    image: devflow/frontend:${TAG:-latest}
    restart: unless-stopped
    depends_on:
      - backend
    networks: [devflow]

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - frontend
      - backend
      - ai
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/nginx/certs:/etc/nginx/certs:ro
    networks: [devflow]

volumes:
  mysql_data:
  redis_data:
  minio_data:
  chroma_data:
  ai_models:
  backend_logs:

networks:
  devflow:
    driver: bridge
